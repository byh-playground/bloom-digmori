name: Build and deploy static Pages
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned build dependencies
        run: npm ci
      - name: Build single HTML and provenance
        run: node scripts/build.mjs
      - name: Build companion combat design preview
        run: node scripts/build-companion-preview.mjs
      - name: Install Chromium for the real SVG/WebGL scenario
        run: npx playwright install --with-deps chromium
      - name: Validate source SVG loading, camera, animation, and world depth
        run: npm run test:companion-svg
      - name: Save actual browser screenshots and validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digmori-companion-svg-browser-evidence
          path: artifacts/companion-svg/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

