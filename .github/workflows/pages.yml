name: Verify original source and deploy Pages
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check original source syntax and required files
        run: |
          set -eu
          test -s index.html
          test -f .nojekyll
          test -d src
          test -d previews
          find src -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -r -n1 node --check
          git diff --check
      - name: Copy source bytes without building
        run: |
          mkdir -p _site artifacts
          cp index.html .nojekyll _site/
          cp -R src previews _site/
          find _site -type f -exec sha256sum {} + | sort > artifacts/pages-sha256.txt
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: digmori-pages-source-hashes
          path: artifacts/pages-sha256.txt
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: _site
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy original source
        id: deployment
        uses: actions/deploy-pages@v4
