name: Verify original source and deploy Pages
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check original source syntax and required files
        run: |
          set -eu
          test -s index.html
          test -f .nojekyll
          test -d src
          test -d previews
          test -s src/assets/player/player-parts.json
          node -e "JSON.parse(require('fs').readFileSync('src/assets/player/player-parts.json','utf8'))"
          for s in root rock-chick mushroom-snail; do test -s "src/assets/units/$s/$s-parts.json"; node -e "JSON.parse(require('fs').readFileSync('src/assets/units/$s/$s-parts.json','utf8'))"; done
          find src -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -r -n1 node --check
          git diff --check
      - name: Copy source bytes without building
        run: |
          mkdir -p _site artifacts
          cp index.html .nojekyll _site/
          cp -R src previews _site/
          find _site -type f -exec sha256sum {} + | sort > artifacts/pages-sha256.txt
          # The player cut-out rig parts ship byte-for-byte: 33 PNGs (29 body parts + sword, spear, axe and pick) plus the grip-point JSON.
          test "$(grep -c '_site/src/assets/player/[a-z_]*\.png$' artifacts/pages-sha256.txt)" -eq 33
          grep -q '_site/src/assets/player/player-parts\.json$' artifacts/pages-sha256.txt
          # The new species cut-out rig parts ship byte-for-byte: 86 PNGs (root 26, rock-chick 35, mushroom-snail 25) plus one parts JSON each,
          # and every PNG is listed in its species JSON (anchors and scales) and every listed part has a PNG.
          test "$(grep -c '_site/src/assets/units/root/[a-z0-9_]*\.png$' artifacts/pages-sha256.txt)" -eq 26
          test "$(grep -c '_site/src/assets/units/rock-chick/[a-z0-9_]*\.png$' artifacts/pages-sha256.txt)" -eq 35
          test "$(grep -c '_site/src/assets/units/mushroom-snail/[a-z0-9_]*\.png$' artifacts/pages-sha256.txt)" -eq 25
          for s in root rock-chick mushroom-snail; do
            grep -q "_site/src/assets/units/$s/$s-parts\.json$" artifacts/pages-sha256.txt
            node -e "const fs=require('fs'),d='_site/src/assets/units/$s/',k=Object.keys(JSON.parse(fs.readFileSync(d+'$s-parts.json','utf8')).parts).sort().join(),p=fs.readdirSync(d).filter(f=>f.endsWith('.png')).map(f=>f.slice(0,-4)).sort().join();if(k!==p)throw Error('$s parts JSON and PNG files differ')"
          done
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: digmori-pages-source-hashes
          path: artifacts/pages-sha256.txt
      - name: Publish bloom-game.json with the Nightly tag name
        if: hashFiles('_site/index.html') != ''
        run: |
          curl -fsS https://raw.githubusercontent.com/byh-playground/bloom-world/main/playground/bloom-game.schema.json -o "$RUNNER_TEMP/schema.json"
          STAMP=$(date -u -d "@$(git show -s --format=%ct "$GITHUB_SHA")" +%Y%m%dT%H%M%SZ)
          jq --arg t "nightly-$STAMP-${GITHUB_SHA:0:12}" '. + {nightly:$t}' bloom-game.json > _site/bloom-game.json
          npx --yes ajv-cli@5 validate --spec=draft2020 -s "$RUNNER_TEMP/schema.json" -d _site/bloom-game.json
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: _site
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy original source
        id: deployment
        uses: actions/deploy-pages@v4
